<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitsky Bet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #500a40 0%, #150012 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 15px;
    }

    /* Заголовок */
    .header-text {
      text-align: center;
      font-weight: 900;
      font-size: 2.2rem;
      line-height: 1.1;
      color: #f3c77c;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    /* Картка з днями тижня */
    .card {
      background: rgba(85, 18, 89, 0.6);
      border: 2px solid #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(5px);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* Перемикачі */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .3s;
      border-radius: 34px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #a855f7; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* Футер */
    .footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 0.7rem;
      color: #aaa;
    }
    .brand { font-weight: bold; font-size: 1.1rem; color: #fff; }
    .btn-play {
      background: transparent;
      border: 2px solid #a855f7;
      color: #fff;
      padding: 6px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header-text">
    Eat. Sleep.<br>Play. Repeat.
  </div>

  <div class="card">
    <div class="row"><span>Monday</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="row"><span>Tuesday</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="row"><span>Wednesday</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="row"><span>Thursday</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="row"><span>Friday</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="row"><span>Saturday</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="row"><span>Sunday</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
  </div>

  <div class="footer">
    <div>
      <div class="brand">Bitsky.bet</div>
      <div>No Purchase Necessary. 18+</div>
    </div>
    <button class="btn-play">PLAY NOW</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
  </script>
</body>
</html>
