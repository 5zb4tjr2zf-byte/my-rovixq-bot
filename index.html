<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- SVG Графіка повністю замінює фото та завантажується миттєво -->
        <svg class="main-bg-svg" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#7fc8f8"/>
                    <stop offset="100%" stop-color="#e0f4ff"/>
                </linearGradient>
                <linearGradient id="sunflowerGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffde59"/>
                    <stop offset="100%" stop-color="#ff914d"/>
                </linearGradient>
            </defs>

            <!-- Небо -->
            <rect width="400" height="700" fill="url(#skyGrad)"/>

            <!-- Хмаринки -->
            <ellipse cx="70" cy="80" rx="40" ry="20" fill="#ffffff" opacity="0.9"/>
            <ellipse cx="100" cy="70" rx="30" ry="25" fill="#ffffff" opacity="0.9"/>
            <ellipse cx="320" cy="60" rx="50" ry="22" fill="#ffffff" opacity="0.8"/>

            <!-- Далекі зелені пагорби -->
            <path d="M-20 320 Q 100 250, 250 300 T 420 280 L 420 700 L -20 700 Z" fill="#8bc34a"/>
            
            <!-- Поле соняшників (жовта зона) -->
            <path d="M-20 360 Q 150 320, 420 340 L 420 440 L -20 440 Z" fill="url(#sunflowerGrad)"/>

            <!-- Стежка -->
            <path d="M 120 700 C 150 550, 200 450, 240 330 L 270 330 C 220 450, 180 550, 170 700 Z" fill="#e5c158"/>

            <!-- Лавандове поле (бузкова зона) -->
            <path d="M-20 440 Q 120 420, 240 450 L 200 700 L -20 700 Z" fill="#8a2be2" opacity="0.75"/>

            <!-- Дерево зправо -->
            <rect x="330" y="240" width="45" height="250" fill="#5c4033" rx="10"/>
            <circle cx="350" cy="220" r="75" fill="#2e7d32"/>
            <circle cx="310" cy="240" r="55" fill="#388e3c"/>
            <circle cx="380" cy="240" r="50" fill="#1b5e20"/>

            <!-- Ведмедик з-за дерева -->
            <g id="bear">
                <circle cx="305" cy="300" r="22" fill="#795548"/> <!-- Голова -->
                <circle cx="295" cy="285" r="7" fill="#5d4037"/> <!-- Вушко -->
                <circle cx="300" cy="303" r="8" fill="#d7ccc8"/> <!-- Мордочка -->
                <circle cx="298" cy="301" r="2.5" fill="#000000"/> <!-- Ніс -->
                <circle cx="303" cy="296" r="2" fill="#000000"/> <!-- Око -->
            </g>

            <!-- Вулик ліворуч -->
            <g id="beehive">
                <!-- Ніжки -->
                <rect x="65" y="470" width="10" height="30" fill="#4a2c11"/>
                <rect x="135" y="470" width="10" height="30" fill="#4a2c11"/>
                <!-- Корпус -->
                <rect x="50" y="380" width="110" height="95" rx="8" fill="#d4a359" stroke="#795548" stroke-width="3"/>
                <line x1="50" y1="410" x2="160" y2="410" stroke="#795548" stroke-width="2"/>
                <line x1="50" y1="440" x2="160" y2="440" stroke="#795548" stroke-width="2"/>
                <!-- Дашок -->
                <polygon points="40,380 105,330 170,380" fill="#8d6e63" stroke="#4a2c11" stroke-width="3"/>
                <!-- Льоток (вхід) -->
                <arc x="90" y="430" width="30" height="30" fill="#3e2723"/>
                <ellipse cx="105" cy="445" rx="12" ry="14" fill="#261202"/>
                <!-- Медові баночки -->
                <rect x="165" y="450" width="16" height="20" rx="3" fill="#ffc107" stroke="#ffffff" stroke-width="1.5"/>
                <rect x="183" y="453" width="14" height="17" rx="3" fill="#ffb300" stroke="#ffffff" stroke-width="1.5"/>
            </g>
        </svg>

        <!-- Анімовані бджілки -->
        <div class="bee-layer bee-1">🐝</div>
        <div class="bee-layer bee-2">🐝</div>
        <div class="bee-layer bee-3">🐝</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
