<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Ghost</title>
<link rel="stylesheet" href="style.css?v=1" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div class="stage">
    <div class="ghost-wrap" id="ghostWrap">
      <img src="ghost.png" alt="" class="ghost-img" id="ghostImg" />
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btnLeft">
      <img src="btn-left.png" alt="Ліворуч" />
    </button>
    <button class="ctrl-btn" id="btnRight">
      <img src="btn-right.png" alt="Праворуч" />
    </button>
  </div>

  <script src="script.js?v=1"></script>
</body>
</html>
