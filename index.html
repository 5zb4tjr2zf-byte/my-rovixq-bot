<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>rovixq</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0B0E14;
    --bg-glow: #12182B;
    --panel: #131826;
    --line: #232A3D;
    --text: #EDEFF5;
    --muted: #8993AB;
    --accent: #5EE6C4;
    --accent-2: #7C8CFF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
  }

  .glow {
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 140%;
    height: 60%;
    background: radial-gradient(ellipse at center, rgba(94,230,196,0.18) 0%, rgba(124,140,255,0.10) 40%, transparent 70%);
    filter: blur(40px);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .ticker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--muted);
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 6px 14px;
    border-radius: 100px;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .glyph {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.1s forwards;
  }

  h1 {
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.2s forwards;
  }

  h1 .name {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.sub {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 36px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.3s forwards;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.4s forwards;
  }

  .coin {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 4px;
    font-size: 20px;
  }

  .coin .sym {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.05em;
  }

  .footer-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.5s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ticker, .glyph, h1, p.sub, .grid, .footer-line {
      animation: none;
      opacity: 1;
    }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="ticker"><span class="dot"></span>LIVE MARKET DATA</div>
    <div class="glyph">₿</div>
    <h1>Привіт, <span class="name" id="username">друже</span></h1>
    <p class="sub">Ти в застосунку rovixq.<br>Тут стежимо за курсом BTC, ETH, TON і SOL.</p>
    <div class="grid">
      <div class="coin">₿<span class="sym">BTC</span></div>
      <div class="coin">Ξ<span class="sym">ETH</span></div>
      <div class="coin">💎<span class="sym">TON</span></div>
      <div class="coin">◎<span class="sym">SOL</span></div>
    </div>
    <div class="footer-line">rovixq_bot · powered by CoinGecko</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user?.first_name) {
        document.getElementById('username').textContent = user.first_name;
      }
      document.documentElement.style.setProperty('--bg', tg.themeParams?.bg_color || '#0B0E14');
    }
  </script>
</body>
</html>
