<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пасіка Mini App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Фон (соняшники) -->
        <div class="sunflower-field"></div>
        
        <!-- Лавандове поле та Ведмідь (анімовані окремо) -->
        <div class="lavender-field-container">
            <div class="lavender-field"></div>
            <div class="bear-layer">
                <img src="https://em-content.zobj.net/source/noto-emoji-animations/344/bear_1f43b.gif" alt="Ведмідь" class="bear-head">
            </div>
        </div>
        
        <!-- Вулик (на землі) -->
        <div class="beehive-container">
            <img src="https://i.imgur.com/K1RkM1v.png" alt="Вулик" class="beehive-sprite">
            <div class="honey-jars"></div>
        </div>

        <!-- Квіти на передньому плані (мак і конюшина) -->
        <div class="foreground-flowers">
            <img src="https://i.imgur.com/P0Y1q6F.png" alt="Мак" class="poppy poppy-1">
            <img src="https://i.imgur.com/P0Y1q6F.png" alt="Мак" class="poppy poppy-2">
            <img src="https://i.imgur.com/zW87J7g.png" alt="Конюшина" class="clover clover-1">
        </div>
        
        <!-- Шари з бджолами (анімовані JavaScript) -->
        <div class="bee-layer bee-1">
            <img src="https://em-content.zobj.net/source/noto-emoji-animations/344/honeybee_1f41d.gif" alt="Бджола" class="bee">
        </div>
        <div class="bee-layer bee-2">
            <img src="https://em-content.zobj.net/source/noto-emoji-animations/344/honeybee_1f41d.gif" alt="Бджола" class="bee">
        </div>
        <div class="bee-layer bee-3">
            <img src="https://em-content.zobj.net/source/noto-emoji-animations/344/honeybee_1f41d.gif" alt="Бджола" class="bee">
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
