<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TG Casino Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { font-family: sans-serif; background: var(--tg-theme-bg-color, #121212); color: var(--tg-theme-text-color, #fff); text-align: center; margin: 0; padding: 20px; }
    .slots { display: flex; justify-content: center; gap: 10px; font-size: 3rem; margin: 20px 0; background: #222; padding: 15px; border-radius: 12px; }
    button { background: var(--tg-theme-button-color, #ff9900); color: var(--tg-theme-button-text-color, #fff); border: none; padding: 12px 24px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>🎰 TG Casino</h2>
  <div class="slots"><span id="s1">🍒</span><span id="s2">🍋</span><span id="s3">7️⃣</span></div>
  <button onclick="spin()">Крутити!</button>
  <h3 id="result">Бажаємо успіху!</h3>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const symbols = ['🍒', '🍋', '7️⃣', '💎', '🍉'];

    function spin() {
      const s1 = symbols[Math.floor(Math.random() * symbols.length)];
      const s2 = symbols[Math.floor(Math.random() * symbols.length)];
      const s3 = symbols[Math.floor(Math.random() * symbols.length)];
      
      document.getElementById('s1').innerText = s1;
      document.getElementById('s2').innerText = s2;
      document.getElementById('s3').innerText = s3;

      if (s1 === s2 && s2 === s3) {
        document.getElementById('result').innerText = '🎉 ДЖЕКПОТ!';
        confetti();
      } else {
        document.getElementById('result').innerText = 'Спробуй ще раз!';
      }
    }
  </script>
</body>
</html>
