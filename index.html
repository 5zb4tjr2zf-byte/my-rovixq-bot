<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>rovixq</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #060A18;
    --panel: #131826;
    --line: #232A3D;
    --text: #EDEFF5;
    --muted: #8993AB;
    --accent: #F7931A;
    --accent-2: #FFC773;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    height: 100%;
  }

  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 24px 20px 32px;
    position: relative;
  }

  .glow {
    position: fixed;
    top: -30%;
    left: -30%;
    width: 160%;
    height: 160%;
    background: radial-gradient(ellipse at center, rgba(247,147,26,0.20) 0%, rgba(255,199,115,0.10) 35%, transparent 65%);
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
    animation: drift 10s ease-in-out infinite;
  }

  @keyframes drift {
    0%   { transform: translate(0%, 0%); }
    25%  { transform: translate(15%, 20%); }
    50%  { transform: translate(-10%, 30%); }
    75%  { transform: translate(-20%, 5%); }
    100% { transform: translate(0%, 0%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; }
  }

  .top {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 100%;
  }

  .greeting {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .greeting b {
    color: var(--text);
    font-weight: 600;
  }

  .balance {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .balance .coin-sym {
    font-size: 30px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .middle {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .coin-wrap {
    position: relative;
    width: 240px;
    height: 240px;
  }

  .coin-btn {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: none;
    background:
      radial-gradient(circle at 35% 30%, #FFD98A 0%, #F7931A 45%, #C96C0C 100%);
    box-shadow:
      0 0 0 8px rgba(247,147,26,0.08),
      0 0 60px rgba(247,147,26,0.35),
      inset 0 -8px 20px rgba(0,0,0,0.25),
      inset 0 8px 16px rgba(255,255,255,0.25);
    font-size: 110px;
    font-weight: 800;
    color: #7A4300;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.06s ease;
    padding: 0;
  }

  .coin-btn:active {
    transform: scale(0.94);
  }

  .float {
    position: absolute;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent-2);
    pointer-events: none;
    animation: floatUp 0.7s ease-out forwards;
    left: 50%;
    top: 50%;
  }

  @keyframes floatUp {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -160%) scale(1.3); }
  }

  .bottom {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 100%;
  }

  .energy-row {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 280px;
    margin: 0 auto 10px;
  }

  .energy-icon {
    font-size: 16px;
  }

  .energy-bar {
    flex: 1;
    height: 10px;
    border-radius: 100px;
    background: var(--panel);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .energy-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 100px;
    transition: width 0.15s ease;
  }

  .energy-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 74px;
    text-align: right;
  }

  .actions-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    max-width: 320px;
    margin: 14px auto 0;
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 68px;
    height: 60px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }

  .action-btn:active {
    background: #1A2133;
    transform: scale(0.96);
  }

  .action-btn .icon {
    font-size: 20px;
  }

  .action-btn .label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .taps-left {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .footer-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-top: 8px;
  }

  /* ---- Полноэкранные экраны ---- */
  .screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .screen.active {
    display: flex;
  }

  .back-btn {
    position: absolute;
    top: 24px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 100px;
    cursor: pointer;
  }

  .back-btn:active {
    background: #1A2133;
  }

  .big-glyph {
    font-size: 80px;
    line-height: 1;
    margin-bottom: 16px;
  }

  .big-name {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .screen-sub {
    font-size: 14px;
    color: var(--muted);
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <div id="mainScreen" style="display:flex; flex-direction:column; align-items:center; justify-content:space-between; width:100%; height:100%; position:relative; z-index:1;">
    <div class="top">
      <div class="greeting">Привет, <b id="username">друг</b> 👋</div>
      <div class="balance"><span class="coin-sym">₿</span><span id="score">0</span></div>
    </div>

    <div class="middle">
      <div class="coin-wrap" id="coinWrap">
        <button class="coin-btn" id="coinBtn">₿</button>
      </div>
    </div>

    <div class="bottom">
      <div class="energy-row">
        <span class="energy-icon">⚡</span>
        <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
        <span class="energy-text" id="energyText">5000/5000</span>
      </div>
      <div class="taps-left" id="tapHint">Нажимай на монету, чтобы зарабатывать</div>

      <div class="actions-row">
        <button class="action-btn" id="btnShop">
          <span class="icon">🛒</span>
          <span class="label">Магазин</span>
        </button>
        <button class="action-btn" id="btnTasks">
          <span class="icon">📋</span>
          <span class="label">Задания</span>
        </button>
        <button class="action-btn" id="btnFriends">
          <span class="icon">👥</span>
          <span class="label">Друзья</span>
        </button>
        <button class="action-btn" id="btnRank">
          <span class="icon">🏆</span>
          <span class="label">Рейтинг</span>
        </button>
      </div>

      <div class="footer-line">rovixq_bot · tap to earn</div>
    </div>
  </div>

  <!-- Экран магазина -->
  <div class="screen" id="screen-shop">
    <button class="back-btn" id="backShopBtn">← Назад</button>
    <div class="big-glyph">🛒</div>
    <div class="big-name">Магазин</div>
    <p class="screen-sub">Скоро здесь появятся улучшения</p>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user?.first_name) {
        document.getElementById('username').textContent = user.first_name;
      }
    }

    const scoreEl = document.getElementById('score');
    const coinBtn = document.getElementById('coinBtn');
    const coinWrap = document.getElementById('coinWrap');
    const energyFill = document.getElementById('energyFill');
    const energyText = document.getElementById('energyText');
    const tapHint = document.getElementById('tapHint');

    const MAX_ENERGY = 5000;
    const REGEN_PER_SEC = 1; // сколько энергии восстанавливается в секунду

    let score = parseInt(localStorage.getItem('btc_taps') || '0', 10);
    let energy = parseInt(localStorage.getItem('btc_energy') || String(MAX_ENERGY), 10);

    scoreEl.textContent = score.toLocaleString('en-US');

    function updateEnergyUI() {
      const pct = Math.max(0, Math.min(100, (energy / MAX_ENERGY) * 100));
      energyFill.style.width = pct + '%';
      energyText.textContent = `${energy}/${MAX_ENERGY}`;
      tapHint.textContent = energy > 0
        ? 'Нажимай на монету, чтобы зарабатывать'
        : 'Энергия закончилась — теперь +1 за тап';
    }
    updateEnergyUI();

    function spawnFloat(x, y, amount) {
      const f = document.createElement('div');
      f.className = 'float';
      f.textContent = '+' + amount;
      f.style.left = x + 'px';
      f.style.top = y + 'px';
      coinWrap.appendChild(f);
      setTimeout(() => f.remove(), 700);
    }

    coinBtn.addEventListener('click', (e) => {
      let gain;
      if (energy >= 5) {
        gain = 5;
        energy -= 5;
      } else {
        gain = 1;
      }

      score += gain;
      scoreEl.textContent = score.toLocaleString('en-US');
      localStorage.setItem('btc_taps', score);
      localStorage.setItem('btc_energy', energy);
      updateEnergyUI();

      const rect = coinWrap.getBoundingClientRect();
      const x = (e.clientX || rect.width / 2) - rect.left;
      const y = (e.clientY || rect.height / 2) - rect.top;
      spawnFloat(x, y, gain);

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    // Медленная регенерация энергии со временем
    setInterval(() => {
      if (energy < MAX_ENERGY) {
        energy = Math.min(MAX_ENERGY, energy + REGEN_PER_SEC);
        localStorage.setItem('btc_energy', energy);
        updateEnergyUI();
      }
    }, 1000);

    // ---- Переход в магазин ----
    const mainScreen = document.getElementById('mainScreen');
    const shopScreen = document.getElementById('screen-shop');

    document.getElementById('btnShop').addEventListener('click', () => {
      mainScreen.style.display = 'none';
      shopScreen.classList.add('active');
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    document.getElementById('backShopBtn').addEventListener('click', () => {
      shopScreen.classList.remove('active');
      mainScreen.style.display = 'flex';
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    // ---- Экран друзей ----
    const friendsScreen = document.getElementById('screen-friends');
    const friendsCountEl = document.getElementById('friendsCount');
    const refLinkEl = document.getElementById('refLink');

    const tgUser = tg?.initDataUnsafe?.user;
    const myId = tgUser?.id || 'demo';
    const refLink = `https://t.me/rovx7_bot?start=ref_${myId}`;
    refLinkEl.textContent = refLink;

    let friendsCount = parseInt(localStorage.getItem('btc_friends') || '0', 10);
    friendsCountEl.textContent = friendsCount;

    document.getElementById('btnFriends').addEventListener('click', () => {
      mainScreen.style.display = 'none';
      friendsScreen.classList.add('active');
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    document.getElementById('backFriendsBtn').addEventListener('click', () => {
      friendsScreen.classList.remove('active');
      mainScreen.style.display = 'flex';
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    document.getElementById('copyLinkBtn').addEventListener('click', () => {
      navigator.clipboard?.writeText(refLink);
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      const btn = document.getElementById('copyLinkBtn');
      const old = btn.textContent;
      btn.textContent = 'Скопировано ✓';
      setTimeout(() => { btn.textContent = old; }, 1500);
    });

    document.getElementById('shareLinkBtn').addEventListener('click', () => {
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent('Заходи, есть крутая тапалка! 🚀')}`);
      }
    });
  </script>
</body>
</html>
